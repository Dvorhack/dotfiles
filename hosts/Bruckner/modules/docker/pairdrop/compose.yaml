---
services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - RATE_LIMIT=false #optional
      - WS_FALLBACK=false #optional
      - RTC_CONFIG= #optional
      - DEBUG_MODE=false #optional
    # ports:
    #   - 3000:3000
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pairdrop.rule=Host(`pairdrop.pouic.cc`)"
      - "traefik.http.routers.pairdrop.entrypoints=websecure"
      - "traefik.http.routers.pairdrop.tls=true"
      - "traefik.http.routers.pairdrop.service=pairdrop"
      - "traefik.http.routers.pairdrop.middlewares=error-handler@docker"
      - "traefik.http.services.pairdrop.loadbalancer.server.port=3000"

networks:
  traefik-net:
    external: true
