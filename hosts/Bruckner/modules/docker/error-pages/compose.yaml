services:
  error-pages:
    image: nginx:alpine
    container_name: error-pages
    volumes:
      - /var/lib/error-pages:/usr/share/nginx/html:ro
      - /var/lib/error-pages/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.error-pages.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.error-pages.priority=1"
      - "traefik.http.routers.error-pages.entrypoints=websecure"
      - "traefik.http.routers.error-pages.tls=true"
      - "traefik.http.services.error-pages.loadbalancer.server.port=80"
      - "traefik.http.middlewares.error-handler.errors.status=400-599"
      - "traefik.http.middlewares.error-handler.errors.service=error-pages@docker"
      - "traefik.http.middlewares.error-handler.errors.query=/{status}.html"
    restart: unless-stopped

networks:
  traefik-net:
    external: true
