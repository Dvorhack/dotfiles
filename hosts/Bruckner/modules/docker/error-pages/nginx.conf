server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # Serve error pages directly (Traefik errors middleware fetches /{status}.html)
    location ~* ^/[0-9]+\.html$ {
        try_files $uri =404;
    }

    # Catch-all: unknown host or path → 404 page
    location / {
        try_files /404.html =500;
    }
}
